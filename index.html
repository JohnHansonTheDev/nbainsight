<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBInsight | Live NBA Odds Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="hero-bg"></div>
    <div class="noise"></div>

    <header class="topbar glass">
      <div>
        <p class="eyebrow">NBInsight • Motion Odds Matrix</p>
        <h1>NBA Live / Upcoming / Final Dashboard</h1>
        <p id="todayDate" class="subline"></p>
      </div>
      <div class="top-actions">
        <button id="gmailLogin" class="btn-gmail">Sign in with Gmail</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel glass">
        <h2>Trending</h2>
        <ul id="trendingList" class="stack"></ul>
        <h3>Status Filters</h3>
        <div class="filter-row">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="live">Live</button>
          <button class="chip" data-filter="upcoming">Upcoming</button>
          <button class="chip" data-filter="final">Final</button>
        </div>
      </aside>

      <section id="gamesGrid" class="games-grid"></section>

      <aside class="panel glass">
        <h2>Injuries + Advice</h2>
        <div id="injuryFeed" class="stack"></div>
        <h3>Market Pulse</h3>
        <div id="marketFeed" class="stack"></div>
      </aside>
    </main>

    <template id="gameCardTemplate">
      <article class="game-card glass">
        <div class="card-head">
          <span class="status"></span>
          <span class="clock"></span>
          <span class="run hidden">⚡ TEAM RUN</span>
        </div>
        <h3 class="matchup"></h3>
        <div class="teams"></div>
        <div class="odds-grid"></div>
        <p class="confidence"></p>
        <blockquote class="quote"></blockquote>
      </article>
    </template>

    <script src="https://unpkg.com/@motionone/dom/dist/motion-one.umd.js"></script>
    <script src="app.js"></script>
  </body>
</html>
